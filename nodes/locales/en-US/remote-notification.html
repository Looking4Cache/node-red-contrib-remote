<script type="text/html" data-help-name="remote-notification">
  <p>With this node you can send a push notification to the devices connected to the selected config node. Select a config node that you already use in an access node. You can use the same config node in several notification nodes.</p>
  <p>Configure the title and the text of the notification. The default values assume that the payload of the incoming message contains the strings “title” and “body”. You can also enter fixed texts or use flow or global variables.</p>
  <p>Whenever a message arrives at the notification node, a notification is sent to your devices.</p>
  <p><b>High priority:</b> If checked, the notification also gets through Do Not Disturb or an active Focus. On iOS it is delivered as a Time Sensitive notification (controlled under Settings › Notifications › Remote-RED and in the Focus settings), the ring/silent switch still applies. On Android it is delivered as an alarm and the sound is played at alarm volume, as long as alarms are allowed in Do Not Disturb (default). Use <code>msg.payload.priority</code> to override the setting per message: <code>"high"</code> or <code>true</code>, <code>"normal"</code> or <code>false</code>. Use high priority only for really important messages.</p>
</script>
